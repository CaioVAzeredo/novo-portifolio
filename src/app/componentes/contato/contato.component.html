<section class="container-contato" id="contato">
    <div class="titulo-contato">
        <h2>Contato</h2>
        <hr>
    </div>
    <p class="texto-sobre-contato">Gostaria de saber sobre seu projeto e como eu posso ajudar. Por favor preencha o formulario, e vou responder de
        volta assim que possível</p>
    <form class="form-contato">
        <div class="form-group">
            <label for="nome">NOME</label>
            <input type="text" id="nome" name="nome" required />
        </div>

        <div class="form-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
            <label for="mensagem">MENSAGEM</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
        </div>

        <button type="submit">ENVIAR MENSAGEM</button>
    </form>

</section>
